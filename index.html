<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário cadastro</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <main>
    <form class="formulario" autocomplete="off">
        <fieldset class="form-inter">
            <legend class="title-form-inter">Cadastro</legend>
            <div class="campo-user">
            <div class="campo">
            <label for="name" class="label-padronizada">Nome</label>
            <input type="text" id="name" class="ipt-padrao" name="name" required>
            </div>
            <div class="campo">
            <label for="email" class="label-padronizada">Email</label>
            <input type="email" id="email" class="ipt-padrao" name="email" required>
            </div>
            </div>
            <div class="campo-cad-endereco">
            <div class="campo-inicial">
            <div class="campo">
            <label for="cep" class="label-padronizada">Cep</label>
            <input type="text" id="cep" class="ipt-padrao" maxlength="9" required  name="cep">
            </div>
            <div class="campo">
            <label for="end" class="label-padronizada">Endereço</label>
            <input type="text" class="ipt-padrao" id="end"  required name="endereco">
            </div>
            <div class="campo">
            <label for="number" class="label-padronizada">Número</label>
            <input type="text" id="number" class="ipt-padrao" required name="number">
            </div>
            </div>
            <div class="campo-secundario">
            <div class="campo">
            <label for="bairro" class="label-padronizada">Bairro</label>
            <input type="text" id="bairro" class="ipt-padrao" required name="bairro">
            </div>
            <div class="campo">
            <label for="city" class="label-padronizada">Cidade</label>
            <input type="text" id="city" class="ipt-padrao" required name="city">
            </div>
            <div class="campo">
            <label for="state" class="label-padronizada">Estado</label>
            <input type="text" id="state" class="ipt-padrao" required name="state">
            </div>
            </div>
            </div>
            <button class="button-send" type="submit">Salvar</button>
        </fieldset>
    </form>
    </main>
    <footer class="rodape">Desenvolvido por Kayque Ferreira © 2026</footer>
</body>
</html>
